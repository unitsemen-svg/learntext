<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 Text Memorizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>📝 Text Memorizer</h1>
      <div id="user-panel" style="display: none;">
        <span id="user-greeting"></span>
        <button id="btn-logout" class="btn-small">Выйти</button>
      </div>
    </header>

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <section id="screen-auth" class="screen active">
      <h2 id="auth-title">Вход в систему</h2>
      <p class="hint" id="auth-hint">Введите Email и пароль. Если нет аккаунта — нажмите "Зарегистрироваться".</p>
      <input type="email" id="auth-login" placeholder="Email (например, test@mail.ru)..." style="margin-bottom: 10px;">
            <div style="position: relative; margin-bottom: 16px;">
        <input type="password" id="auth-password" placeholder="Пароль (минимум 6 символов)..." style="width: 100%; padding-right: 40px;">
        <button type="button" id="toggle-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px; opacity: 0.6; padding: 5px;">👁️</button>
      </div>
      
      <button id="btn-login" class="btn btn-primary" style="margin-bottom: 10px;">Войти</button>
      <button id="btn-register-mode" class="btn btn-secondary" style="width: 100%;">У меня нет аккаунта (Регистрация)</button>
    </section>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <section id="screen-menu" class="screen">
      <h2>Мои тексты</h2>
      <div id="saved-texts-list" class="saved-list"></div>
      
      <hr style="margin: 20px 0; border: none; border-top: 2px solid #edf2f7;">
      
      <h3>Добавить новый текст</h3>
      <input type="text" id="text-title" placeholder="Название текста..." style="margin-bottom: 10px;">
      <textarea id="text-input" placeholder="Вставь сюда текст..."></textarea>
      
      <div class="settings">
        <label>Строчек за раз: 
  <select id="lines-per-chunk">
    <option value="1">1</option>
    <option value="2" selected>2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
    <option value="8">8</option>
    <option value="10">10</option>
  </select>
</label>
        <label>Повторов: <select id="repeats-per-chunk"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></label>
      </div>
      <button id="btn-start" class="btn btn-primary">Начать заучивание →</button>
    </section>

    <!-- ЭКРАН ПРОСМОТРА -->
    <section id="screen-view" class="screen">
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <div class="progress-text" id="progress-text">0 / 0</div>
      <h2>Запомни эти строчки</h2>
      <div id="view-lines" class="lines-display"></div>
      <button id="btn-next" class="btn btn-primary">Далее →</button>
    </section>

    <!-- ЭКРАН ПРОВЕРКИ -->
    <section id="screen-check" class="screen">
      <div class="progress-bar"><div id="progress-fill-check" class="progress-fill"></div></div>
      <div class="progress-text" id="progress-text-check">0 / 0</div>
      <h2>Напиши по памяти</h2>
      <div id="check-inputs" class="check-inputs"></div>
      <button id="btn-submit" class="btn btn-primary">Проверить ✓</button>
    </section>

    <!-- ЭКРАН РЕЗУЛЬТАТА -->
    <section id="screen-result" class="screen">
      <h2 id="result-title">Результат</h2>
      <div id="result-body"></div>
      <div class="result-buttons">
        <button id="btn-combined-check" class="btn btn-secondary" style="display: none; background: #ecc94b; color: #744210;">📝 Написать всё вместе</button>
        <button id="btn-repeat" class="btn btn-secondary">🔁 Повторить</button>
        <button id="btn-continue" class="btn btn-primary">Продолжить →</button>
      </div>
    </section>
    
    <!-- ФИНАЛ -->
    <section id="screen-done" class="screen">
      <h2>🎉 Поздравляем!</h2>
      <p>Вы выучили этот текст!</p>
      <div class="result-buttons" style="justify-content: center;">
        <button id="btn-back-to-menu" class="btn btn-secondary">В меню</button>
      </div>
    </section>
  </div>

  <!-- ПОДКЛЮЧАЕМ СКРИПТЫ -->
  <script src="app.js"></script>
  <script type="module" src="firebase.js"></script>
</body>
</html>
